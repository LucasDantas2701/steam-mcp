<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam Fictícia</title>
<style>
  :root {
    --bg: #171a21; --painel: #1b2838; --card: #213246; --borda: #2a475e;
    --texto: #c7d5e0; --fraco: #8f98a0; --destaque: #66c0f4; --verde: #a4d007; --erro: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--texto); }
  header { background: var(--painel); padding: 16px 24px; border-bottom: 1px solid var(--borda); }
  header h1 { margin: 0; font-size: 22px; color: #fff; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--fraco); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr 320px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: var(--destaque); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input, select, button, textarea { font: inherit; color: var(--texto); background: var(--bg); border: 1px solid var(--borda); border-radius: 4px; padding: 8px 10px; }
  input, select { flex: 1 1 140px; min-width: 0; }
  button { cursor: pointer; background: linear-gradient(90deg, #47bfff, #1a44c2); border: 0; color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.15); }
  button.secundario { background: var(--card); border: 1px solid var(--borda); }
  .status { font-size: 13px; color: var(--fraco); margin-bottom: 8px; min-height: 18px; }
  .status.erro { color: var(--erro); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 4px; padding: 12px; cursor: pointer; border: 1px solid transparent; transition: border-color .15s; }
  .card:hover { border-color: var(--destaque); }
  .card h3 { margin: 0 0 6px; font-size: 15px; color: #fff; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .tag { font-size: 11px; background: rgba(103,193,245,.15); color: var(--destaque); padding: 2px 6px; border-radius: 3px; }
  .tag.plat { background: rgba(255,255,255,.06); color: var(--fraco); }
  .linha { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .preco { background: #4c6b22; color: var(--verde); padding: 3px 8px; border-radius: 3px; font-weight: 700; font-size: 14px; }
  .nota { font-size: 13px; color: var(--fraco); }
  pre { background: var(--bg); border: 1px solid var(--borda); border-radius: 4px; padding: 10px; overflow: auto; max-height: 320px; font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; }
  .lateral { display: grid; gap: 16px; align-content: start; }
  .lateral p { margin: 0; line-height: 1.5; font-size: 14px; }
  .campo { display: grid; gap: 4px; margin-bottom: 8px; font-size: 13px; }
  .campo input { width: 100%; }
  .descricao { font-size: 13px; color: var(--fraco); margin: 6px 0 10px; }
  dialog { background: var(--painel); color: var(--texto); border: 1px solid var(--borda); border-radius: 6px; max-width: 480px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
  dialog dt { color: var(--fraco); }
  dialog dd { margin: 0; }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>STEAM FICTÍCIA</h1>
  <p>Frontend de teste: cada ação chama uma tool do servidor MCP <code>steam</code>.</p>
</header>

<main>
  <section>
    <h2>Loja</h2>
    <div class="filtros">
      <input id="termo" placeholder="Buscar por título (buscar_jogos)">
      <button id="btnBuscar">Buscar</button>
    </div>
    <div class="filtros">
      <select id="genero"><option value="">Todos os gêneros</option></select>
      <select id="plataforma"><option value="">Todas as plataformas</option></select>
      <input id="precoMax" type="number" min="0" step="0.01" placeholder="Preço máx. (R$)">
      <button id="btnFiltrar">Filtrar</button>
    </div>
    <div id="status" class="status"></div>
    <div id="grade" class="grade"></div>
  </section>

  <div class="lateral">
    <section>
      <h2>Promoções (resource)</h2>
      <p id="promocoes">Carregando…</p>
    </section>

    <section>
      <h2>Prompt recomendar_jogo</h2>
      <div class="campo">Gênero <input id="pGenero" value="RPG"></div>
      <div class="campo">Plataforma <input id="pPlataforma" value="Steam Deck"></div>
      <button class="secundario" id="btnPrompt">Gerar prompt</button>
      <pre id="saidaPrompt" hidden></pre>
    </section>
  </div>

  <section class="full">
    <h2>Console MCP</h2>
    <div class="filtros">
      <select id="tool"></select>
    </div>
    <div id="descricaoTool" class="descricao"></div>
    <form id="formTool"></form>
    <button id="btnChamar">Chamar tool</button>
    <pre id="saidaTool">Escolha uma tool e clique em "Chamar tool".</pre>
  </section>
</main>

<dialog id="detalhes">
  <h2 id="dTitulo"></h2>
  <dl id="dLista"></dl>
  <form method="dialog"><button>Fechar</button></form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
let TOOLS = [];

async function chamar(nome, args = {}) {
  const r = await fetch(`/api/tools/${nome}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args),
  });
  const json = await r.json();
  if (!r.ok) throw new Error(json.erro);
  return json.resultado;
}

function status(texto, erro = false) {
  $("status").textContent = texto;
  $("status").className = "status" + (erro ? " erro" : "");
}

function el(tag, classe, texto) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function renderJogos(jogos, origem) {
  const grade = $("grade");
  grade.replaceChildren();
  status(`${jogos.length} jogo(s) — via ${origem}`);
  for (const j of jogos) {
    const card = el("div", "card");
    card.append(el("h3", null, j.titulo));
    const tags = el("div", "tags");
    j.generos.forEach(g => tags.append(el("span", "tag", g)));
    j.plataformas.forEach(p => tags.append(el("span", "tag plat", p)));
    card.append(tags);
    const linha = el("div", "linha");
    linha.append(el("span", "nota", `★ ${j.nota} · ${j.ano}`), el("span", "preco", brl(j.preco)));
    card.append(linha);
    card.onclick = () => abrirDetalhes(j.id);
    grade.append(card);
  }
}

async function executar(fn, origem) {
  status("Consultando…");
  try { renderJogos(await fn(), origem); }
  catch (e) { $("grade").replaceChildren(); status(e.message, true); }
}

async function abrirDetalhes(id) {
  try {
    const j = await chamar("detalhes_jogo", { jogo_id: id });
    $("dTitulo").textContent = j.titulo;
    const dl = $("dLista");
    dl.replaceChildren();
    const campos = [
      ["Id", j.id], ["Desenvolvedora", j.desenvolvedora], ["Ano", j.ano],
      ["Gêneros", j.generos.join(", ")], ["Plataformas", j.plataformas.join(", ")],
      ["Preço", brl(j.preco)], ["Nota", j.nota],
    ];
    for (const [k, v] of campos) dl.append(el("dt", null, k), el("dd", null, String(v)));
    $("detalhes").showModal();
  } catch (e) { status(e.message, true); }
}

// ---- Loja ----
$("btnBuscar").onclick = () =>
  executar(() => chamar("buscar_jogos", { termo: $("termo").value }), "buscar_jogos");
$("termo").onkeydown = e => { if (e.key === "Enter") $("btnBuscar").click(); };

$("btnFiltrar").onclick = () => {
  const args = {};
  if ($("genero").value) args.genero = $("genero").value;
  if ($("plataforma").value) args.plataforma = $("plataforma").value;
  if ($("precoMax").value) args.preco_maximo = Number($("precoMax").value);
  executar(() => chamar("filtrar_jogos", args), "filtrar_jogos");
};

// ---- Prompt ----
$("btnPrompt").onclick = async () => {
  const r = await fetch("/api/prompt/recomendar_jogo", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ genero: $("pGenero").value, plataforma: $("pPlataforma").value }),
  });
  const json = await r.json();
  $("saidaPrompt").hidden = false;
  $("saidaPrompt").textContent = json.mensagens.map(m => `[${m.papel}] ${m.texto}`).join("\n\n");
};

// ---- Console MCP ----
function montarFormulario() {
  const tool = TOOLS.find(t => t.nome === $("tool").value);
  $("descricaoTool").textContent = tool.descricao || "";
  const form = $("formTool");
  form.replaceChildren();
  const props = tool.schema.properties || {};
  const obrigatorios = tool.schema.required || [];
  for (const [nome, def] of Object.entries(props)) {
    const tipos = def.anyOf ? def.anyOf.map(a => a.type) : [def.type];
    const numerico = tipos.includes("integer") || tipos.includes("number");
    const campo = el("label", "campo", `${nome} (${tipos.filter(t => t !== "null").join(" | ")})${obrigatorios.includes(nome) ? " *" : ""}`);
    const input = el("input");
    input.name = nome;
    input.dataset.numerico = numerico;
    if (numerico) { input.type = "number"; input.step = "any"; }
    campo.append(input);
    form.append(campo);
  }
  if (!Object.keys(props).length) form.append(el("div", "descricao", "Esta tool não recebe argumentos."));
}

$("tool").onchange = montarFormulario;
$("formTool").onsubmit = e => { e.preventDefault(); $("btnChamar").click(); };

$("btnChamar").onclick = async () => {
  const args = {};
  for (const input of $("formTool").querySelectorAll("input")) {
    if (input.value === "") continue;
    args[input.name] = input.dataset.numerico === "true" ? Number(input.value) : input.value;
  }
  const nome = $("tool").value;
  $("saidaTool").textContent = `→ ${nome}(${JSON.stringify(args)})\n\nAguardando…`;
  try {
    const r = await chamar(nome, args);
    $("saidaTool").textContent = `→ ${nome}(${JSON.stringify(args)})\n\n${JSON.stringify(r, null, 2)}`;
  } catch (err) {
    $("saidaTool").textContent = `→ ${nome}(${JSON.stringify(args)})\n\nERRO (o que o modelo veria):\n${err.message}`;
  }
};

// ---- Inicialização ----
async function iniciar() {
  try {
    const [generos, plataformas, tools, promo] = await Promise.all([
      chamar("listar_generos"),
      chamar("listar_plataformas"),
      fetch("/api/tools").then(r => r.json()),
      fetch("/api/promocoes").then(r => r.json()),
    ]);
    generos.forEach(g => $("genero").append(new Option(g, g)));
    plataformas.forEach(p => $("plataforma").append(new Option(p, p)));
    $("promocoes").textContent = promo.texto;
    TOOLS = tools;
    tools.forEach(t => $("tool").append(new Option(t.nome, t.nome)));
    montarFormulario();
    executar(() => chamar("filtrar_jogos"), "filtrar_jogos");
  } catch (e) {
    status("Falha ao falar com o servidor MCP: " + e.message, true);
  }
}
iniciar();
</script>
</body>
</html>
